name: Emulator Run CI

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-latest-test-all:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VAB_FLAGS: -cg -f '-d no_load_styles' -v 3 --api 30 --build-tools 33.0.2
      VFLAGS: -no-parallel
    steps:
    - uses: actions/setup-java@v4
        id: uses_setup_java_v4
      with:
        distribution: 'adopt'
        java-version: 17

    - name: Checkout V
        id: checkout_v
        if: ${{ !cancelled() && steps.uses_setup_java_v4.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        repository: vlang/v
        path: v

    - name: Build and install v
        id: build_and_install_v
        if: ${{ !cancelled() && steps.checkout_v.outcome == 'success' }}
      run: cd ./v && make -j4 && sudo ./v symlink

    - name: Checkout vab
        id: checkout_vab
        if: ${{ !cancelled() && steps.build_and_install_v.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        path: vab

    - name: Simulate "v install vab"
        id: simulate_v_install_vab
        if: ${{ !cancelled() && steps.checkout_vab.outcome == 'success' }}
      run: mv vab ~/.vmodules

    - name: Build vab
        id: build_vab
        if: ${{ !cancelled() && steps.simulate_v_install_vab.outcome == 'success' }}
      run: v -g ~/.vmodules/vab

    - name: Symlink vab
        id: symlink_vab
        if: ${{ !cancelled() && steps.build_vab.outcome == 'success' }}
      run: sudo ln -s ~/.vmodules/vab/vab /usr/local/bin/vab

    - name: Run vab --help
        id: run_vab_help
        if: ${{ !cancelled() && steps.symlink_vab.outcome == 'success' }}
      run: vab --help

    - name: Run vab doctor *before*
        id: run_vab_doctor_before
        if: ${{ !cancelled() && steps.run_vab_help.outcome == 'success' }}
      run: vab doctor

    - name: Install dependencies
        id: install_dependencies
        if: ${{ !cancelled() && steps.run_vab_doctor_before.outcome == 'success' }}
      run: |
        v retry -- sudo apt update
        v retry -- sudo apt install --quiet -y qemu-kvm
        sudo chown $USER /dev/kvm

    - name: Install SDK dependencies
        id: install_sdk_dependencies
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
      run: |
        vab install "platform-tools"
        vab install "build-tools;33.0.2"
        vab install "platforms;android-30"
        vab install emulator
        vab install bundletool
        vab install aapt2

    - name: Run vab doctor *after*
        id: run_vab_doctor_after
        if: ${{ !cancelled() && steps.install_sdk_dependencies.outcome == 'success' }}
      run: vab doctor

    - name: Cache emulator
        if: ${{ !cancelled() && steps.run_vab_doctor_after.outcome == 'success' }}
      id: cache-emulator
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/lib/android/sdk/system-images/android-30
        key: ${{ runner.os }}-android-emulator-${{ hashFiles('/usr/local/lib/android/sdk/system-images') }}

    - name: Prepare emulator
      if: steps.cache-emulator.outputs.cache-hit != 'true'
      run: |
        vab install 'system-images;android-30;aosp_atd;x86_64'

    - name: Run `vab test-all`
        id: run_vab_test_all
        if: ${{ !cancelled() && steps.cache-emulator.outcome == 'success' }}
      run: |
        vab test-all

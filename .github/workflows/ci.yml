name: Code CI

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  code-formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VFLAGS: -cc tcc
    steps:
    - name: Checkout V
        id: checkout_v
      uses: actions/checkout@v4
      with:
        repository: vlang/v

    - name: Build local v
        id: build_local_v
        if: ${{ !cancelled() && steps.checkout_v.outcome == 'success' }}
      run: make -j4 && sudo ./v symlink

    - name: Checkout vab
        id: checkout_vab
        if: ${{ !cancelled() && steps.build_local_v.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        path: vab

    - name: Test code formatting
        id: test_code_formatting
        if: ${{ !cancelled() && steps.checkout_vab.outcome == 'success' }}
      run: |
        cd vab
        v test-fmt

    # TODO this makes formatting checks fail?
    #- name: Simulate "v install vab"
    #  run: mv vab ~/.vmodules

    - name: Symlink as module
        id: symlink_as_module
        if: ${{ !cancelled() && steps.test_code_formatting.outcome == 'success' }}
      run: sudo ln -s $(pwd)/vab ~/.vmodules/vab # Workaround for doing `mv vab ~/.vmodules`

    - name: Build vab with -skip-unused
        id: build_vab_with_skip_unused
        if: ${{ !cancelled() && steps.symlink_as_module.outcome == 'success' }}
      run: v -skip-unused ~/.vmodules/vab

    - name: Build vab
        id: build_vab
        if: ${{ !cancelled() && steps.build_vab_with_skip_unused.outcome == 'success' }}
      run: v -g ~/.vmodules/vab

    - name: Symlink vab command
        id: symlink_vab_command
        if: ${{ !cancelled() && steps.build_vab.outcome == 'success' }}
      run: sudo ln -s ~/.vmodules/vab/vab /usr/local/bin/vab

    - name: Test clean vab code
        id: test_clean_vab_code
        if: ${{ !cancelled() && steps.symlink_vab_command.outcome == 'success' }}
      run: |
        vab test-cleancode ~/.vmodules/vab

  ubuntu-latest-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VAB_FLAGS: -v 3
    steps:
    - name: Checkout V
        id: checkout_v
      uses: actions/checkout@v4
      with:
        repository: vlang/v

    - name: Build local v
        id: build_local_v
        if: ${{ !cancelled() && steps.checkout_v.outcome == 'success' }}
      run: make -j4 && sudo ./v symlink

    - name: Checkout vab
        id: checkout_vab
        if: ${{ !cancelled() && steps.build_local_v.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        path: vab

    - name: Simulate "v install vab"
        id: simulate_v_install_vab
        if: ${{ !cancelled() && steps.checkout_vab.outcome == 'success' }}
      run: mv vab ~/.vmodules

    - name: Build vab with -prod
        id: build_vab_with_prod
        if: ${{ !cancelled() && steps.simulate_v_install_vab.outcome == 'success' }}
      run: v -prod ~/.vmodules/vab

    - name: Build vab
        id: build_vab
        if: ${{ !cancelled() && steps.build_vab_with_prod.outcome == 'success' }}
      run: v -g ~/.vmodules/vab

    - name: Symlink vab
        id: symlink_vab
        if: ${{ !cancelled() && steps.build_vab.outcome == 'success' }}
      run: sudo ln -s ~/.vmodules/vab/vab /usr/local/bin/vab

    - name: Run 'vab --help'
        id: run_vab_help
        if: ${{ !cancelled() && steps.symlink_vab.outcome == 'success' }}
      run: vab --help

    - name: Ruin Android environment on purpose
        id: ruin_android_environment_on_purpose
        if: ${{ !cancelled() && steps.run_vab_help.outcome == 'success' }}
      run: |
        sudo rm -fr /usr/local/lib/android

    - name: Run 'vab doctor' before
        id: run_vab_doctor_before
        if: ${{ !cancelled() && steps.ruin_android_environment_on_purpose.outcome == 'success' }}
      run: vab doctor

    - name: Run 'vab install auto'
        id: run_vab_install_auto
        if: ${{ !cancelled() && steps.run_vab_doctor_before.outcome == 'success' }}
      run: |
        unset ANDROID_SDK_ROOT # These are set in the CI by default
        unset ANDROID_HOME
        unset ANDROID_NDK_ROOT
        vab install auto

    - name: Run 'vab doctor' after
        id: run_vab_doctor_after
        if: ${{ !cancelled() && steps.run_vab_install_auto.outcome == 'success' }}
      run: vab doctor

    - name: Test vab complete
        id: test_vab_complete
        if: ${{ !cancelled() && steps.run_vab_doctor_after.outcome == 'success' }}
      run: |
        [ "$(vab complete bash vab com)" = "COMPREPLY+=('complete')" ]

    - name: Run tests
        id: run_tests
        if: ${{ !cancelled() && steps.test_vab_complete.outcome == 'success' }}
      run: v test ~/.vmodules/vab

    - name: Build APK (Default) examples/sokol/particles
        id: build_apk_default_examples_sokol_particles
        if: ${{ !cancelled() && steps.run_tests.outcome == 'success' }}
      run: |
        mkdir apks
        vab examples/sokol/particles -o apks/particles.apk
        [ -f apks/particles.apk ]

  ubuntu-latest-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VAB_FLAGS: -v 3
    steps:
    - name: Checkout V
        id: checkout_v
      uses: actions/checkout@v4
      with:
        repository: vlang/v

    - name: Build local v
        id: build_local_v
        if: ${{ !cancelled() && steps.checkout_v.outcome == 'success' }}
      run: make -j4 && sudo ./v symlink

    - name: Checkout vab
        id: checkout_vab
        if: ${{ !cancelled() && steps.build_local_v.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        path: vab

    - name: Simulate "v install vab"
        id: simulate_v_install_vab
        if: ${{ !cancelled() && steps.checkout_vab.outcome == 'success' }}
      run: mv vab ~/.vmodules

    - name: Build vab with -prod
        id: build_vab_with_prod
        if: ${{ !cancelled() && steps.simulate_v_install_vab.outcome == 'success' }}
      run: v -prod  ~/.vmodules/vab

    - name: Build vab
        id: build_vab
        if: ${{ !cancelled() && steps.build_vab_with_prod.outcome == 'success' }}
      run: v -g ~/.vmodules/vab

    - name: Symlink vab
        id: symlink_vab
        if: ${{ !cancelled() && steps.build_vab.outcome == 'success' }}
      run: sudo ln -s ~/.vmodules/vab/vab /usr/local/bin/vab

    - name: Run 'vab --help'
        id: run_vab_help
        if: ${{ !cancelled() && steps.symlink_vab.outcome == 'success' }}
      run: vab --help

    - name: Ruin Android environment on purpose
        id: ruin_android_environment_on_purpose
        if: ${{ !cancelled() && steps.run_vab_help.outcome == 'success' }}
      run: |
        sudo rm -fr "$ANDROID_SDK_ROOT/platforms"

    - name: Run 'vab doctor'
        id: run_vab_doctor
        if: ${{ !cancelled() && steps.ruin_android_environment_on_purpose.outcome == 'success' }}
      run: vab doctor

    - name: Run vab --list-* flags
        id: run_vab_list_flags
        if: ${{ !cancelled() && steps.run_vab_doctor.outcome == 'success' }}
      run: |
        vab --list-apis
        vab --list-build-tools
        vab --list-ndks

    - name: Run 'vab install "platforms;android-21"'
        id: run_vab_install_platforms_android_21
        if: ${{ !cancelled() && steps.run_vab_list_flags.outcome == 'success' }}
      run: vab install "platforms;android-21"

    - name: Run vab doctor
        id: run_vab_doctor_2
        if: ${{ !cancelled() && steps.run_vab_install_platforms_android_21.outcome == 'success' }}
      run: vab doctor

    - name: Run tests
        id: run_tests
        if: ${{ !cancelled() && steps.run_vab_doctor_2.outcome == 'success' }}
      run: v test ~/.vmodules/vab

    - name: Build APK (Default) examples/sokol/particles
        id: build_apk_default_examples_sokol_particles
        if: ${{ !cancelled() && steps.run_tests.outcome == 'success' }}
      run: |
        mkdir apks
        vab examples/sokol/particles -o apks/particles.apk
        [ -f apks/particles.apk ]

  ubuntu-latest-extra-command:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VFLAGS: -d vab_allow_extra_commands
      VAB_FLAGS: -v 3
    steps:
    - name: Checkout V
        id: checkout_v
      uses: actions/checkout@v4
      with:
        repository: vlang/v

    - name: Build local v
        id: build_local_v
        if: ${{ !cancelled() && steps.checkout_v.outcome == 'success' }}
      run: make -j4 && sudo ./v symlink

    - name: Install dependencies
        id: install_dependencies
        if: ${{ !cancelled() && steps.build_local_v.outcome == 'success' }}
      run: |
        v retry -- sudo apt-get update
        v retry -- sudo apt-get install --quiet -y libsdl2-dev libsdl2-ttf-dev
        v retry -- sudo apt-get install --quiet -y libsdl2-mixer-dev libsdl2-image-dev
       
    - name: Checkout SDL
        id: checkout_sdl
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        repository: vlang/sdl
        fetch-depth: 0
        path: sdl

    - name: Simulate "v install sdl"
        id: simulate_v_install_sdl
        if: ${{ !cancelled() && steps.checkout_sdl.outcome == 'success' }}
      run: mv sdl ~/.vmodules

    - name: Setup vlang/sdl
        id: setup_vlang_sdl
        if: ${{ !cancelled() && steps.simulate_v_install_sdl.outcome == 'success' }}
      run: v ~/.vmodules/sdl/setup.vsh

    - name: Checkout vab
        id: checkout_vab
        if: ${{ !cancelled() && steps.setup_vlang_sdl.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        path: vab

    - name: Install vab
        id: install_vab
        if: ${{ !cancelled() && steps.checkout_vab.outcome == 'success' }}
      run: |
        mv vab ~/.vmodules
        v -g ~/.vmodules/vab
        sudo ln -s ~/.vmodules/vab/vab /usr/local/bin/vab

    - name: Run 'vab --help'
        id: run_vab_help
        if: ${{ !cancelled() && steps.install_vab.outcome == 'success' }}
      run: vab --help

    - name: Install extra command
        id: install_extra_command
        if: ${{ !cancelled() && steps.run_vab_help.outcome == 'success' }}
      run: |
        vab install extra larpon/vab-sdl

    - name: Run vab doctor
        id: run_vab_doctor
        if: ${{ !cancelled() && steps.install_extra_command.outcome == 'success' }}
      run: vab doctor

    - name: Test extra command
        id: test_extra_command
        if: ${{ !cancelled() && steps.run_vab_doctor.outcome == 'success' }}
      run: |
        vab sdl doctor

  ubuntu-latest-vab-can-live-anywhere:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VAB_FLAGS: -v 3
    steps:
    - name: Checkout V
        id: checkout_v
      uses: actions/checkout@v4
      with:
        repository: vlang/v

    - name: Build local v
        id: build_local_v
        if: ${{ !cancelled() && steps.checkout_v.outcome == 'success' }}
      run: make -j4 && sudo ./v symlink

    - name: Checkout vab
        id: checkout_vab
        if: ${{ !cancelled() && steps.build_local_v.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        path: vab

    - name: Simulate "v install vab"
        id: simulate_v_install_vab
        if: ${{ !cancelled() && steps.checkout_vab.outcome == 'success' }}
      run: mv vab ~/.vmodules

    - name: Build vab
        id: build_vab
        if: ${{ !cancelled() && steps.simulate_v_install_vab.outcome == 'success' }}
      run: v -g ~/.vmodules/vab

    - name: Move vab
        id: move_vab
        if: ${{ !cancelled() && steps.build_vab.outcome == 'success' }}
      run: |
        sudo mv ~/.vmodules/vab/vab /usr/bin/vab

    - name: Run 'vab --help'
        id: run_vab_help
        if: ${{ !cancelled() && steps.move_vab.outcome == 'success' }}
      run: /usr/bin/vab --help

    - name: Run 'vab doctor'
        id: run_vab_doctor
        if: ${{ !cancelled() && steps.run_vab_help.outcome == 'success' }}
      run: /usr/bin/vab doctor

    - name: Run tests
        id: run_tests
        if: ${{ !cancelled() && steps.run_vab_doctor.outcome == 'success' }}
      run: v test ~/.vmodules/vab

    - name: Build APK (Default) examples/sokol/particles
        id: build_apk_default_examples_sokol_particles
        if: ${{ !cancelled() && steps.run_tests.outcome == 'success' }}
      run: |
        mkdir apks
        /usr/bin/vab examples/sokol/particles -o apks/particles.apk
        [ -f apks/particles.apk ]

  v-compiles-os-android:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout V
        id: checkout_v
      uses: actions/checkout@v4
      with:
        repository: vlang/v

    - name: Build local v
        id: build_local_v
        if: ${{ !cancelled() && steps.checkout_v.outcome == 'success' }}
      run: make -j4 && sudo ./v symlink

    - name: Checkout vab
        id: checkout_vab
        if: ${{ !cancelled() && steps.build_local_v.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        path: vab

    - name: Simulate "v install vab"
        id: simulate_v_install_vab
        if: ${{ !cancelled() && steps.checkout_vab.outcome == 'success' }}
      run: mv vab ~/.vmodules/

    - name: Build vab
        id: build_vab
        if: ${{ !cancelled() && steps.simulate_v_install_vab.outcome == 'success' }}
      run: v -g ~/.vmodules/vab

    - name: Symlink vab
        id: symlink_vab
        if: ${{ !cancelled() && steps.build_vab.outcome == 'success' }}
      run: sudo ln -s ~/.vmodules/vab/vab /usr/local/bin/vab

    - name: Run vab --help
        id: run_vab_help
        if: ${{ !cancelled() && steps.symlink_vab.outcome == 'success' }}
      run: vab --help

    - name: Run vab doctor
        id: run_vab_doctor
        if: ${{ !cancelled() && steps.run_vab_help.outcome == 'success' }}
      run: vab doctor

    - name: Check `v -os android` *without* -apk flag
        id: check_v_os_android_without_apk_flag
        if: ${{ !cancelled() && steps.run_vab_doctor.outcome == 'success' }}
      run: .github/workflows/android_cross_compile.vsh

  windows-latest-build:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VAB_FLAGS: -cg -v 3 --api 31 --build-tools 35.0.1
    steps:

    - uses: actions/setup-java@v4
        id: uses_setup_java_v4
      with:
        distribution: 'adopt'
        java-version: 17

    - name: Install V
        id: install_v
        if: ${{ !cancelled() && steps.uses_setup_java_v4.outcome == 'success' }}
      uses: vlang/setup-v@v1.4
      with:
        check-latest: true

      # TODO: https://github.com/vlang/setup-v/issues
    - name: Checkout V examples
        id: checkout_v_examples
        if: ${{ !cancelled() && steps.install_v.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        repository: vlang/v
        path: v

    - name: Checkout vab
        id: checkout_vab
        if: ${{ !cancelled() && steps.checkout_v_examples.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        path: vab

    - name: Simulate "v install vab"
        id: simulate_v_install_vab
        if: ${{ !cancelled() && steps.checkout_vab.outcome == 'success' }}
      run: Move-Item -Path .\vab -Destination $HOME\.vmodules\vab -force

# TODO: fails on Windows
#    - name: Build vab with -prod
#      run: v -prod "$HOME\.vmodules\vab"

    - name: Build vab
        id: build_vab
        if: ${{ !cancelled() && steps.simulate_v_install_vab.outcome == 'success' }}
      run: v -g "$HOME\.vmodules\vab"

    - name: Add vab to PATH
        id: add_vab_to_path
        if: ${{ !cancelled() && steps.build_vab.outcome == 'success' }}
      run: echo "$HOME\.vmodules\vab" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Run vab --help
        id: run_vab_help
        if: ${{ !cancelled() && steps.add_vab_to_path.outcome == 'success' }}
      run: vab --help

    - name: Install Java matching build-tools
        id: install_java_matching_build_tools
        if: ${{ !cancelled() && steps.run_vab_help.outcome == 'success' }}
      run: |
        vab install "build-tools;35.0.1"

    - name: Install AAB dependencies
        id: install_aab_dependencies
        if: ${{ !cancelled() && steps.install_java_matching_build_tools.outcome == 'success' }}
      run: |
        vab install bundletool
        vab install aapt2

    - name: Run vab doctor
        id: run_vab_doctor
        if: ${{ !cancelled() && steps.install_aab_dependencies.outcome == 'success' }}
      run: vab doctor

    - name: Run vab --list-* flags
        id: run_vab_list_flags
        if: ${{ !cancelled() && steps.run_vab_doctor.outcome == 'success' }}
      run: |
        vab --list-apis
        vab --list-build-tools
        vab --list-ndks

    - name: Run tests
        id: run_tests
        if: ${{ !cancelled() && steps.run_vab_list_flags.outcome == 'success' }}
      run: v test "$HOME\.vmodules\vab"

    - name: Build APK (Default) v/examples/sokol/particles
        id: build_apk_default_v_examples_sokol_particles
        if: ${{ !cancelled() && steps.run_tests.outcome == 'success' }}
      run: |
        mkdir apks
        vab v\examples\sokol\particles -o apks\particles.apk
        # TODO vab/vab v/examples/sokol/particles -o aabs/particles.aab

  macos-latest-build:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VAB_FLAGS: -cg -v 3
      VFLAGS: -no-parallel
    steps:
    - uses: actions/setup-java@v4
        id: uses_setup_java_v4
      with:
        distribution: 'adopt'
        java-version: 17

    - name: Checkout V
        id: checkout_v
        if: ${{ !cancelled() && steps.uses_setup_java_v4.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        repository: vlang/v
        path: v

    - name: Build and install v
        id: build_and_install_v
        if: ${{ !cancelled() && steps.checkout_v.outcome == 'success' }}
      run: cd ./v && make && sudo ./v symlink

    - name: Checkout vab
        id: checkout_vab
        if: ${{ !cancelled() && steps.build_and_install_v.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        path: vab

    - name: Simulate "v install vab"
        id: simulate_v_install_vab
        if: ${{ !cancelled() && steps.checkout_vab.outcome == 'success' }}
      run: mv vab ~/.vmodules

    - name: Build vab with -prod
        id: build_vab_with_prod
        if: ${{ !cancelled() && steps.simulate_v_install_vab.outcome == 'success' }}
      run: v -prod ~/.vmodules/vab

    - name: Build vab
        id: build_vab
        if: ${{ !cancelled() && steps.build_vab_with_prod.outcome == 'success' }}
      run: v -g ~/.vmodules/vab

    - name: Symlink vab
        id: symlink_vab
        if: ${{ !cancelled() && steps.build_vab.outcome == 'success' }}
      run: sudo ln -s ~/.vmodules/vab/vab /usr/local/bin/vab

    - name: Run vab --help
        id: run_vab_help
        if: ${{ !cancelled() && steps.symlink_vab.outcome == 'success' }}
      run: vab --help

    - name: Run vab doctor
        id: run_vab_doctor
        if: ${{ !cancelled() && steps.run_vab_help.outcome == 'success' }}
      run: vab doctor

    - name: Run tests
        id: run_tests
        if: ${{ !cancelled() && steps.run_vab_doctor.outcome == 'success' }}
      run: v test ~/.vmodules/vab

    - name: Build APK (Default) examples/sokol/particles
        id: build_apk_default_examples_sokol_particles
        if: ${{ !cancelled() && steps.run_tests.outcome == 'success' }}
      run: |
        mkdir apks
        vab v/examples/sokol/particles -o apks/particles.apk
        [ -f apks/particles.apk ]


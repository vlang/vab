name: Docs CI

### Run on *EVERY* commit. The documentation *SHOULD* stay valid, and
### the developers should receive early warning if they break it.
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VFLAGS: -cc tcc
    steps:
    - name: Checkout V
      id: checkout_v
      uses: actions/checkout@v4
      with:
        repository: vlang/v

    - name: Build local v
      id: build_local_v
      if: ${{ success() && !cancelled() && steps.checkout_v.outcome == 'success' }}
      run: make -j4 && sudo ./v symlink

    - name: Checkout vab
      id: checkout_vab
      if: ${{ success() && !cancelled() && steps.build_local_v.outcome == 'success' }}
      uses: actions/checkout@v4
      with:
        path: vab

    - name: Symlink as module
      id: symlink_as_module
      if: ${{ success() && !cancelled() && steps.checkout_vab.outcome == 'success' }}
      run: sudo ln -s $(pwd)/vab ~/.vmodules/vab # Workaround for doing `mv vab ~/.vmodules`

    - name: Check markdown line length & code examples
      id: check_markdown_line_length_code_examples
      if: ${{ success() && !cancelled() && steps.symlink_as_module.outcome == 'success' }}
      run: v check-md -hide-warnings vab
      ## NB: -hide-warnings is used here, so that the output is less noisy,
      ## thus real errors are easier to spot.

  report-missing-fn-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOPTIONS: --relative-paths --exclude /tests/
    steps:
      - name: Checkout V
        id: checkout_v
        uses: actions/checkout@v4
        with:
          repository: vlang/v

      - name: Build local v
        id: build_local_v
        if: ${{ success() && !cancelled() && steps.checkout_v.outcome == 'success' }}
        run: make -j4 && sudo ./v symlink

      - name: Checkout vab
        id: checkout_vab
        if: ${{ success() && !cancelled() && steps.build_local_v.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          path: vab

      - name: Checkout previous vab
        id: checkout_previous_vab
        if: ${{ success() && !cancelled() && steps.checkout_vab.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: vlang/vab
          ref: master
          path: pvab

      - name: Check against parent commit
        id: check_against_parent_commit
        if: ${{ success() && !cancelled() && steps.checkout_previous_vab.outcome == 'success' }}
        run: v missdoc --diff $MOPTIONS pvab vab
